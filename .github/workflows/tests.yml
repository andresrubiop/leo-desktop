name: Tests
on:
  push:
    paths-ignore: ['**/*.md', '**/*.cff', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', '**/*.cff', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system test dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 python3-pil poppler-utils xvfb xauth dbus-x11 gsettings-desktop-schemas
      - name: Python unit tests (no user extension activation)
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
      - name: Movement logic
        run: node tests/movement.mjs
